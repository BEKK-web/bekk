allowBuilds:
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@next/env@15.5.24'
  - '@next/eslint-plugin-next@15.5.24'
  - '@next/swc-darwin-arm64@15.5.24'
  - '@next/swc-darwin-x64@15.5.24'
  - '@next/swc-linux-arm64-gnu@15.5.24'
  - '@next/swc-linux-arm64-musl@15.5.24'
  - '@next/swc-linux-x64-gnu@15.5.24'
  - '@next/swc-linux-x64-musl@15.5.24'
  - '@next/swc-win32-arm64-msvc@15.5.24'
  - '@next/swc-win32-x64-msvc@15.5.24'
  - eslint-config-next@15.5.24
  - next@15.5.24
  - '@next/third-parties@15.5.24'

# Next 15.5 arrastra postcss 8.4.31, que tiene 4 advisories (2 high: lectura
# arbitraria de archivos y path traversal vía source maps). Son de build, no de
# runtime, pero el bump es dentro del mismo major y no rompe nada.
overrides:
  postcss: ^8.5.23
